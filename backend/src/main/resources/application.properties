# ===== Aplicación =====
spring.application.name=biblioteca
server.port=${SERVER_PORT:8083}

# ===== Base de datos (usa variables de entorno; NO subas credenciales reales) =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/biblioteca_act3?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Mexico_City&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# ===== JPA / Hibernate =====
# update: crea/ajusta las tablas automáticamente (bueno para aprender; en producción real usar migraciones)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
